<!DOCTYPE html>
<html>
<head>
    <title>Particle Test</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: Arial, sans-serif; }
        #status { position: fixed; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.8); padding: 10px; }
    </style>
</head>
<body>
    <div id="status">
        <div>Particle System Test</div>
        <div id="results">Loading...</div>
    </div>
    
    <script src="js/libs/three.min.js"></script>
    <script src="js/particles.js"></script>
    <script>
        const results = document.getElementById('results');
        
        if (typeof THREE !== 'undefined') {
            results.innerHTML = '✅ Three.js loaded<br>';
            
            try {
                const particles = new ParticleSystem({ particleCount: 100 });
                results.innerHTML += '✅ Particle system created<br>';
                
                setTimeout(() => {
                    const stats = particles.getPerformanceStats();
                    results.innerHTML += `✅ FPS: ${stats.fps}, Particles: ${stats.particleCount}<br>`;
                    results.innerHTML += '✅ All tests passed!';
                }, 3000);
                
            } catch (error) {
                results.innerHTML += `❌ Error: ${error.message}`;
            }
        } else {
            results.innerHTML = '❌ Three.js not loaded';
        }
    </script>
</body>
</html>
