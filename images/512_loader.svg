<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Loader</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg {
      width: 300px;
      height: 300px;
      fill: #fff;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)) drop-shadow(0 0 40px rgba(235,127,80,0.7));
    }

    path:nth-of-type(1) {
      animation: float1 3s infinite ease-in-out;
    }

    path:nth-of-type(2) {
      animation: float2 3s infinite ease-in-out;
    }

    path:nth-of-type(3) {
      animation: float3 3s infinite ease-in-out;
    }

    @keyframes float1 {
      0%, 100% { transform: translateY(15px); }
      50% { transform: translateY(-15px); }
    }

    @keyframes float2 {
      0%, 100% { transform: translateY(-10x); }
      50% { transform: translateY(100px); }
    }

    @keyframes float3 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-108px); }
    }

    .loader-exit {
      animation: fadeOut 5s forwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }
  </style>
</head>
<body>

  <div id="loader">
